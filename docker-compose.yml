version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: meditriage-backend
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - MIGRATION_DATABASE_URL=${MIGRATION_DATABASE_URL}
      - APP_ENCRYPTION_KEY=${APP_ENCRYPTION_KEY}
      - APP_RUT_HASH_KEY=${APP_RUT_HASH_KEY}
      - JWT_SECRET=${JWT_SECRET}
      - COOKIE_SECURE=${COOKIE_SECURE:-false}
      - REDIS_URL=redis://redis:6379/0
      - PORT=8000
      - ENVIRONMENT=${ENVIRONMENT:-development}
      - CORS_ORIGINS=${CORS_ORIGINS:-http://localhost:3000}
      - RATE_LIMIT_LOGIN=${RATE_LIMIT_LOGIN:-10/minute}
      - RATE_LIMIT_TRIAGE=${RATE_LIMIT_TRIAGE:-120/minute}
      - TRUSTED_PROXY_HOPS=${TRUSTED_PROXY_HOPS:-0}

  db:
    image: postgres:16-alpine
    container_name: meditriage-db
    restart: always
    environment:
      POSTGRES_USER: meditriage_user
      POSTGRES_PASSWORD: meditriage_pass
      POSTGRES_DB: meditriage_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql

  redis:
    image: redis:7-alpine
    container_name: meditriage-redis
    restart: always
    ports:
      - "6379:6379"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        BACKEND_URL: http://backend:8000
        NEXT_PUBLIC_WS_URL: ws://localhost:8000/api/v1/ws/tablero
    container_name: meditriage-frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    depends_on:
      - backend
volumes:
  postgres_data:
