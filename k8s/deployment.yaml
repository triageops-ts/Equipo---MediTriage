apiVersion: apps/v1
kind: Deployment
metadata:
  name: meditriage-backend
  namespace: triageops
  labels:
    app: meditriage-backend
    part-of: meditriage
    tier: backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: meditriage-backend
  template:
    metadata:
      labels:
        app: meditriage-backend
        part-of: meditriage
        tier: backend
    spec:
      containers:
        - name: backend
          image: meditriage-backend@sha256:bacad97b3abf0d0739e227dcc4970f93c85ab35e834a20c0f423beadf5da0cac
          ports:
            - containerPort: 8000
          envFrom:
            - configMapRef:
                name: meditriage-backend-config
            - secretRef:
                name: triageops-secrets
          resources:
            requests:
              cpu: "250m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          readinessProbe:
            httpGet:
              path: /api/v1/health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /api/v1/health
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3
