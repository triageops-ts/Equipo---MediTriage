
apiVersion: policies.kyverno.io/v1
kind: ImageValidatingPolicy
metadata:
  name: require-image-signature
spec:
  validationActions:
    - Audit

  failurePolicy: Ignore

  webhookConfiguration:
    timeoutSeconds: 15

  matchConstraints:
    namespaceSelector:
      matchExpressions:
        - key: kubernetes.io/metadata.name
          operator: In
          values:
            - triageops
            - triageops-dev
    resourceRules:
      - apiGroups:
          - ""
        apiVersions:
          - v1
        operations:
          - CREATE
          - UPDATE
        resources:
          - pods
      - apiGroups:
          - apps
        apiVersions:
          - v1
        operations:
          - CREATE
          - UPDATE
        resources:
          - deployments

  matchImageReferences:
    - glob: 'ghcr.io/triageops-ts/meditriage-backend*'

  attestors:
    - name: cosign
      cosign:
        keyless:
          identities:
            - subjectRegExp: '^https://github\.com/triageops-ts/Equipo---MediTriage/\.github/workflows/supply-chain\.yml@refs/heads/main$'
              issuer: 'https://token.actions.githubusercontent.com'
        ctlog:
          url: 'https://rekor.sigstore.dev'

  validations:
    - expression: >-
        images.containers.map(
          image,
          verifyImageSignatures(image, [attestors.cosign])
        ).all(e, e > 0)
      message: 'La imagen de MediTriage debe tener una firma Cosign keyless valida del workflow autorizado.'
