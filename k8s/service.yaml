apiVersion: v1
kind: Service
metadata:
  name: meditriage-backend
  namespace: triageops
  labels:
    app: meditriage-backend
    part-of: meditriage
    tier: backend
spec:
  type: ClusterIP
  selector:
    app: meditriage-backend
  ports:
    - name: http
      port: 80
      targetPort: 8000
    # Solo lo usa el ServiceMonitor. El Ingress apunta al puerto 80, así que /metrics no se publica.
    - name: metrics
      port: 9464
      targetPort: metrics
