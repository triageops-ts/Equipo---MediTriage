# Fixtures sintéticos de la alerta MediTriageErrorBudgetBurn (tarjeta 16).
# Se cargan series ya agregadas con valores inventados, porque 30 min de lab
# no producen 6 h ni 30 d reales.
#
# Ejecutar desde la raíz del repo:
#   promtool test rules observability/prometheus/tests/burn-fixtures.yml
#
# Umbrales: rama rápida 14,4 * 0,005 = 0,072 ; rama lenta 6 * 0,005 = 0,03
rule_files:
  - ../rules.yml

evaluation_interval: 1m

tests:
  # Caso 1: DISPARA. Rama rápida: 8 % en 1 h (burn 16) y 10 % en 5 min (burn 20).
  - interval: 1m
    input_series:
      - series: 'meditriage:availability_error:ratio_rate1h'
        values: '0.08+0x20'
      - series: 'meditriage:availability_error:ratio_rate5m'
        values: '0.10+0x20'
    alert_rule_test:
      - eval_time: 10m
        alertname: MediTriageErrorBudgetBurn
        exp_alerts:
          - exp_labels:
              severity: page
              team: sre
            exp_annotations:
              summary: "MediTriage está consumiendo el error budget de disponibilidad demasiado rápido"
              runbook_url: ops/runbooks/triage-error-budget-burn.md

  # Caso 2: NO DISPARA. Ventana corta mala sin ventana larga.
  #   rápida: 5 min en 10 % pero 1 h solo 2 %
  #   lenta : 30 min en 18 % pero 6 h solo 2 % (burn 4 < 6)
  - interval: 1m
    input_series:
      - series: 'meditriage:availability_error:ratio_rate5m'
        values: '0.10+0x20'
      - series: 'meditriage:availability_error:ratio_rate1h'
        values: '0.02+0x20'
      - series: 'meditriage:availability_error:ratio_rate30m'
        values: '0.18+0x20'
      - series: 'meditriage:availability_error:ratio_rate6h'
        values: '0.02+0x20'
    alert_rule_test:
      - eval_time: 10m
        alertname: MediTriageErrorBudgetBurn
        exp_alerts: []