# Config SOLO para pruebas locales con docker compose (en el cluster real lo hace el ServiceMonitor).
global:
  scrape_interval: 15s
  evaluation_interval: 30s
rule_files:
  - /etc/prometheus/rules.yml
scrape_configs:
  - job_name: meditriage-backend
    metrics_path: /metrics
    static_configs:
      - targets: ["backend:9464"]
