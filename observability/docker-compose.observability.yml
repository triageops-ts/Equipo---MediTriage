# Prometheus + Grafana locales para probar el dashboard (S11-17) sin Kubernetes.
# Se usa junto al compose principal, desde la raiz del repo:
#   docker compose -f docker-compose.yml -f observability/docker-compose.observability.yml up -d --build backend redis prometheus grafana
# Grafana: http://localhost:3000 (admin / admin)   Prometheus: http://localhost:9090
services:
  backend:
    environment:
      - METRICS_PORT=9464

  prometheus:
    image: prom/prometheus:v2.55.1
    container_name: meditriage-prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=35d
    volumes:
      - ./observability/prometheus/prometheus.local.yml:/etc/prometheus/prometheus.yml:ro
      - ./observability/prometheus/rules.yml:/etc/prometheus/rules.yml:ro
    ports:
      - "9090:9090"
    depends_on:
      - backend

  grafana:
    image: grafana/grafana:11.3.0
    container_name: meditriage-grafana
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "3000:3000"
    depends_on:
      - prometheus
