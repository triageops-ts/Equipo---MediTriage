title = "MediTriage: configuración de gitleaks"

[extend]
# Usa todas las reglas por defecto de gitleaks y le agrega las excepciones de abajo.
useDefault = true

[[allowlists]]
description = "Llaves locales de desarrollo generadas con mkcert (backend/localhost+1-key.pem). Solo sirven para HTTPS en el computador de cada integrante y no se usan en ningún ambiente real."
paths = ['''backend/localhost\+1.*\.pem''']

[[allowlists]]
description = "Token de ejemplo del catálogo de eventos (docs/data/event-catalog.md). Es un valor ficticio de documentación, no una credencial."
regexes = ['''tok_sec_abc123''']
