name: CI Pipeline - Quality, Build and Push

on:
  push:
    branches:
      - main
    paths:
      - 'backend/**'
      - 'frontend/**'
      - 'api/**'
      - '.spectral.yaml'
      - '.github/workflows/ci.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'backend/**'
      - 'frontend/**'
      - 'api/**'
      - '.spectral.yaml'
      - '.github/workflows/ci.yml'

permissions:
  contents: read
  packages: write

jobs:
  # ---------------------------------------------------------------------------
  # quality (backend): lint, migraciones y pruebas con cobertura mínima de 80 %
  # (DoD #2 del charter). Falla si ruff encuentra errores, si una prueba falla o si la
  # cobertura baja de 80 %. Las pruebas de base de datos y de Redis corren de verdad
  # (con servicios), no se omiten.
  # ---------------------------------------------------------------------------
  quality:
    name: Backend Quality Check
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: meditriage_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d meditriage_db"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # Valores solo para este job (base desechable). La app se conecta como meditriage_app
      # (con RLS); las migraciones, como el usuario dueño.
      MIGRATION_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/meditriage_db
      DATABASE_URL: postgresql://meditriage_app:ci_app_pass@localhost:5432/meditriage_db
      REDIS_URL: redis://localhost:6379/0
      APP_ENCRYPTION_KEY: clave-cifrado-solo-para-ci-0123456789
      APP_RUT_HASH_KEY: clave-hash-rut-solo-para-ci-0123456789
      JWT_SECRET: clave-jwt-solo-para-ci-0123456789-0123456789-abcdef
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      # ruff no está en requirements.txt (no se despliega); se fija la versión aquí.
      - name: Lint (ruff check)
        run: |
          pip install "ruff==0.16.9"
          ruff check .

      - name: Aplicar migraciones (alembic upgrade head)
        run: alembic upgrade head

      # Las migraciones crean meditriage_app sin login; aquí se le da contraseña para conectarse.
      - name: Habilitar login del rol meditriage_app
        run: |
          psql "$MIGRATION_DATABASE_URL" -v ON_ERROR_STOP=1 \
            -c "ALTER ROLE meditriage_app WITH LOGIN PASSWORD 'ci_app_pass'"

      # La migración 0012 desactiva las cuentas demo, pero las pruebas de base de datos
      # necesitan un enfermero activo (si no, se omiten en silencio). Solo en esta base de CI.
      - name: Reactivar usuarios demo (solo base de CI)
        run: |
          psql "$MIGRATION_DATABASE_URL" -v ON_ERROR_STOP=1 -c \
            "UPDATE usuario_staff SET activo = true WHERE usuario_id IN ('a1111111-1111-4111-8111-111111111111','b2222222-2222-4222-8222-222222222222','c3333333-3333-4333-8333-333333333333')"
      - name: Instalar schemathesis para pruebas de contrato
        run: pip install --no-deps schemathesis==3.39.15 hypothesis jsonschema-rs werkzeug pyrate-limiter sortedcontainers jsonschema attrs referencing rpds-py jsonschema-specifications hypothesis-jsonschema graphql-core
      - name: Pruebas con cobertura mínima de 80 %
        run: pytest --cov=app --cov-report=term-missing --cov-fail-under=80

  # ---------------------------------------------------------------------------
  # spectral: lint del contrato OpenAPI con el .spectral.yaml del repo.
  # Spectral sale con código 1 si hay errores (--fail-severity=error); los warnings
  # se muestran pero no bloquean.
  # ---------------------------------------------------------------------------
  spectral:
    name: Spectral (OpenAPI)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: spectral lint api/openapi.yaml
        run: npx --yes @stoplight/spectral-cli@6.15.0 lint api/openapi.yaml --ruleset .spectral.yaml --fail-severity=error

  # ---------------------------------------------------------------------------
  # frontend: instalación limpia, lint, build y revisión de datos personales.
  # ---------------------------------------------------------------------------
  frontend:
    name: Frontend Quality Check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies (npm ci)
        run: npm ci

      - name: Lint (npm run lint)
        run: npm run lint

      - name: Build (npm run build)
        run: npm run build

      - name: Revisar datos personales (npm run check:pii)
        run: npm run check:pii

  shutdown-test:
    name: Apagado ordenado (SIGTERM en menos de 30 s)
    needs: quality
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Construir la imagen
        run: docker build -t meditriage-shutdown-test ./backend

      - name: Enviar SIGTERM y medir el apagado
        run: |
          docker run -d --name api -e PORT=8000 -e WEB_CONCURRENCY=2 meditriage-shutdown-test

          # Esperar a que arranquen los 2 workers (máximo 30 s)
          for i in $(seq 1 30); do
            listos=$(docker logs api 2>&1 | grep -c "Application startup complete" || true)
            [ "$listos" -ge 2 ] && break
            sleep 1
          done
          [ "$listos" -ge 2 ] || { echo "Los workers no arrancaron"; docker logs api; exit 1; }

          inicio=$(date +%s)
          docker kill --signal=SIGTERM api
          codigo=$(docker wait api)
          duracion=$(( $(date +%s) - inicio ))

          docker logs api
          completos=$(docker logs api 2>&1 | grep -c "shutdown_completo" || true)
          echo "Apagado en ${duracion}s, código de salida ${codigo}, workers cerrados: ${completos}"

          [ "$duracion" -lt 30 ] || { echo "El apagado tardó 30 s o más"; exit 1; }
          [ "$completos" -ge 2 ] || { echo "No todos los workers cerraron en orden"; exit 1; }

  build-and-push:
    name: Build Multi-stage Image and Push to GHCR
    needs: [quality, shutdown-test]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/triageops-ts/meditriage-backend
          tags: |
            type=sha,prefix=,format=long

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: ghcr.io/triageops-ts/meditriage-backend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
        
  frontend-build-and-push:
    name: Build and Push Frontend to GHCR
    needs: frontend
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push Frontend Image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          tags: ghcr.io/triageops-ts/meditriage-frontend:${{ github.sha }}
          build-args: |
            BACKEND_URL=http://meditriage-backend:80
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend
  promote:
    name: Promote Image to GitOps Dev
    needs: build-and-push
    if: false
    runs-on: ubuntu-latest

    steps:
      - name: Checkout GitOps Repository
        uses: actions/checkout@v4
        with:
          repository: triageops-ts/triageops-gitops
          ref: main
          token: ${{ secrets.GITOPS_TOKEN }}
          path: gitops

      - name: Update Dev Image Tag
        working-directory: gitops
        env:
          IMAGE_TAG: ${{ github.sha }}
        run: |
          python - <<'PY'
          import os
          import re
          from pathlib import Path

          path = Path("overlays/dev/kustomization.yaml")
          content = path.read_text()

          pattern = r'(?m)^(\s*newTag:\s*)["\']?[^"\'\r\n]+["\']?\s*$'
          updated, count = re.subn(
              pattern,
              lambda m: f'{m.group(1)}"{os.environ["IMAGE_TAG"]}"',
              content
          )

          if count != 1:
              raise SystemExit(
                  f"Expected exactly one newTag, found {count}"
              )

          path.write_text(updated)
          PY

      - name: Commit and Push GitOps Change
        working-directory: gitops
        env:
          IMAGE_TAG: ${{ github.sha }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add overlays/dev/kustomization.yaml

          if git diff --cached --quiet; then
            echo "No GitOps changes to commit."
          else
            git commit -m "chore(dev): promote ${IMAGE_TAG}"
            git push origin HEAD:main
          fi
