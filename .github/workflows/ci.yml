
name: CI Pipeline - Backend Build, Push and Promote

on:
  push:
    branches:
      - main
    paths:
      - 'backend/**'
      - '.github/workflows/ci.yml'

permissions:
  contents: read

jobs:
  build-and-push:
    name: Build and Push Backend Image
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_PAT }}

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/meditriage-backend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  promote:
    name: Promote Image to GitOps Dev
    runs-on: ubuntu-latest
    needs: build-and-push

    steps:
      - name: Checkout GitOps Repository
        uses: actions/checkout@v4
        with:
          repository: triageops-ts/triageops-gitops
          ref: main
          token: ${{ secrets.GITOPS_TOKEN }}
          path: gitops

      - name: Update Dev Image Tag
        env:
          IMAGE_TAG: ${{ github.sha }}
        run: |
          python - <<'PY'
          import os
          import re
          from pathlib import Path

          path = Path("gitops/overlays/dev/kustomization.yaml")
          content = path.read_text()

          updated, count = re.subn(
              r'(?m)^(\s*newTag:\s*).+$',
              lambda match: match.group(1) + '"' + os.environ["IMAGE_TAG"] + '"',
              content,
              count=1,
          )

          if count != 1:
              raise SystemExit(
                  "ERROR: No se encontró exactamente un newTag para actualizar."
              )

          path.write_text(updated)
          PY

      - name: Validate Kustomize Dev
        run: |
          kubectl kustomize gitops/overlays/dev > /tmp/rendered-dev.yaml

      - name: Commit and Push GitOps Update
        working-directory: gitops
        env:
          IMAGE_TAG: ${{ github.sha }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add overlays/dev/kustomization.yaml

          if git diff --cached --quiet; then
            echo "No hay cambios para promover."
            exit 0
          fi

          git commit -m "chore(dev): promote backend ${IMAGE_TAG}"
          git push origin HEAD:main
