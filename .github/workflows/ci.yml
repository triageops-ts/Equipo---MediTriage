name: CI Pipeline - Backend Quality, Build and Push

on:
  push:
    branches:
      - main
    paths:
      - 'backend/**'
      - '.github/workflows/ci.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'backend/**'
      - '.github/workflows/ci.yml'

permissions:
  contents: read
  packages: write

jobs:
  quality:
    name: Backend Quality Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies and Run Quality Check
        run: |
          cd backend
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          echo "Quality checks passed successfully!"

  shutdown-test:
    name: Apagado ordenado (SIGTERM en menos de 30 s)
    needs: quality
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Construir la imagen
        run: docker build -t meditriage-shutdown-test ./backend

      - name: Enviar SIGTERM y medir el apagado
        run: |
          docker run -d --name api -e PORT=8000 -e WEB_CONCURRENCY=2 meditriage-shutdown-test

          # Esperar a que arranquen los 2 workers (máximo 30 s)
          for i in $(seq 1 30); do
            listos=$(docker logs api 2>&1 | grep -c "Application startup complete" || true)
            [ "$listos" -ge 2 ] && break
            sleep 1
          done
          [ "$listos" -ge 2 ] || { echo "Los workers no arrancaron"; docker logs api; exit 1; }

          inicio=$(date +%s)
          docker kill --signal=SIGTERM api
          codigo=$(docker wait api)
          duracion=$(( $(date +%s) - inicio ))

          docker logs api
          completos=$(docker logs api 2>&1 | grep -c "shutdown_completo" || true)
          echo "Apagado en ${duracion}s, código de salida ${codigo}, workers cerrados: ${completos}"

          [ "$duracion" -lt 30 ] || { echo "El apagado tardó 30 s o más"; exit 1; }
          [ "$completos" -ge 2 ] || { echo "No todos los workers cerraron en orden"; exit 1; }

  build-and-push:
    name: Build Multi-stage Image and Push to GHCR
    needs: [quality, shutdown-test]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/triageops-ts/meditriage-backend
          tags: |
            type=sha,prefix=,format=long

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: ghcr.io/triageops-ts/meditriage-backend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
        
  promote:
    name: Promote Image to GitOps Dev
    needs: build-and-push
    if: false
    runs-on: ubuntu-latest

    steps:
      - name: Checkout GitOps Repository
        uses: actions/checkout@v4
        with:
          repository: triageops-ts/triageops-gitops
          ref: main
          token: ${{ secrets.GITOPS_TOKEN }}
          path: gitops

      - name: Update Dev Image Tag
        working-directory: gitops
        env:
          IMAGE_TAG: ${{ github.sha }}
        run: |
          python - <<'PY'
          import os
          import re
          from pathlib import Path

          path = Path("overlays/dev/kustomization.yaml")
          content = path.read_text()

          pattern = r'(?m)^(\s*newTag:\s*)["\']?[^"\'\r\n]+["\']?\s*$'
          updated, count = re.subn(
              pattern,
              lambda m: f'{m.group(1)}"{os.environ["IMAGE_TAG"]}"',
              content
          )

          if count != 1:
              raise SystemExit(
                  f"Expected exactly one newTag, found {count}"
              )

          path.write_text(updated)
          PY

      - name: Commit and Push GitOps Change
        working-directory: gitops
        env:
          IMAGE_TAG: ${{ github.sha }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add overlays/dev/kustomization.yaml

          if git diff --cached --quiet; then
            echo "No GitOps changes to commit."
          else
            git commit -m "chore(dev): promote ${IMAGE_TAG}"
            git push origin HEAD:main
          fi
