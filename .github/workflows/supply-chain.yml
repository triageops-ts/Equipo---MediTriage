name: Supply Chain

# Sin filtros de rutas: los dos checks (iac-scan y container-scan) deben aparecer en todos los PRs.
on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: supply-chain-${{ github.ref }}
  cancel-in-progress: true

# Los dos jobs son bloqueantes: si hay hallazgos, el job falla y el PR no se puede mezclar.
# Ninguno es tolerante a fallos: no se les permite continuar si encuentran hallazgos.
jobs:
  # ---------------------------------------------------------------------------
  # iac-scan: Checkov sobre terraform/
  # ---------------------------------------------------------------------------
  iac-scan:
    name: iac-scan
    runs-on: ubuntu-latest
    env:
      CHECKOV_VERSION: "3.2.90"
    steps:
      - name: Descargar el código
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar Checkov
        run: pip install "checkov==${CHECKOV_VERSION}"

      # Checkov sale con código 1 si hay checks fallidos.
      - name: Escanear terraform/ (Checkov)
        run: |
          checkov \
            --directory terraform \
            --framework terraform \
            --compact

  # ---------------------------------------------------------------------------
  # container-scan: Trivy sobre la imagen buildeada del backend
  # ---------------------------------------------------------------------------
  container-scan:
    name: container-scan
    runs-on: ubuntu-latest
    env:
      # Binario oficial con verificación de checksum; no trivy-action
      # (sus tags fueron comprometidos en marzo de 2026).
      TRIVY_VERSION: "0.76.1"
      IMAGE: meditriage-backend:scan
    steps:
      - name: Descargar el código
        uses: actions/checkout@v4

      - name: Construir la imagen del backend
        run: docker build -t "$IMAGE" -f backend/Dockerfile backend

      - name: Instalar Trivy
        run: |
          set -euo pipefail
          base="https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}"
          file="trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz"
          cd "$RUNNER_TEMP"
          curl -sSfL -O "${base}/${file}"
          curl -sSfL -O "${base}/trivy_${TRIVY_VERSION}_checksums.txt"
          sha256sum --ignore-missing -c "trivy_${TRIVY_VERSION}_checksums.txt"
          tar -xzf "${file}" trivy
          "$RUNNER_TEMP/trivy" --version

      # Falla (exit 1) si la imagen tiene vulnerabilidades HIGH/CRITICAL con parche disponible.
      - name: Escanear la imagen (Trivy)
        run: |
          "$RUNNER_TEMP/trivy" image \
            --scanners vuln \
            --severity HIGH,CRITICAL \
            --ignore-unfixed \
            --exit-code 1 \
            --format table \
            "$IMAGE"

  # ---------------------------------------------------------------------------
  # dast (tarjeta #16): OWASP ZAP baseline contra el backend levantado en el runner
  # ---------------------------------------------------------------------------
  # No hay un staging público al que llegar desde GitHub, así que el job levanta la imagen
  # del backend en el propio runner y la escanea en http://localhost:8000 (hace las veces del
  # "port-forward" de la tarjeta). El baseline es pasivo: revisa lo que responde la app, no
  # lanza ataques.
  # No bloquea por advertencias (-I): falla si ZAP no puede escanear (código 3) o si se
  # dispara una regla marcada FAIL en .zap/rules.tsv. Las alertas aceptadas se documentan
  # ahí con IGNORE. El reporte se sube siempre como artefacto.
  dast:
    name: dast
    runs-on: ubuntu-latest
    env:
      IMAGE: meditriage-backend:dast
      # Imagen oficial de ZAP. TODO: fijarla por digest, como se hizo con Trivy.
      ZAP_IMAGE: ghcr.io/zaproxy/zaproxy:stable
      TARGET: http://localhost:8000
    steps:
      - name: Descargar el código
        uses: actions/checkout@v4

      - name: Construir la imagen del backend
        run: docker build -t "$IMAGE" -f backend/Dockerfile backend

      # Valores solo para este job. No hay base de datos: los endpoints que la usan responderán
      # con error, pero ZAP solo revisa la superficie HTTP (cabeceras, cookies, rutas públicas).
      # La clave de cifrado es aleatoria y desechable.
      - name: Levantar el backend en el runner
        run: |
          docker run -d --name backend --network host \
            -e PORT=8000 \
            -e DATABASE_URL="postgresql://ci:ci@localhost:5432/ci" \
            -e APP_ENCRYPTION_KEY="$(openssl rand -hex 16)" \
            "$IMAGE"

      # Confirma que la URL es accesible desde el runner antes de escanear.
      - name: Esperar a que el backend responda
        run: |
          for i in $(seq 1 30); do
            code=$(curl -s -o /dev/null -w '%{http_code}' "$TARGET/docs" || true)
            if [ "$code" != "000" ]; then
              echo "Backend listo (HTTP $code en $TARGET/docs)"
              exit 0
            fi
            sleep 2
          done
          echo "El backend no respondió en 60 s. Logs del contenedor:"
          docker logs backend
          exit 1

      # Salida de ZAP: 0 sin alertas bloqueantes, 1 si hay una regla FAIL, 3 si falló el escaneo.
      - name: Escanear con ZAP baseline
        run: |
          mkdir -p zap-out
          cp .zap/rules.tsv zap-out/rules.tsv
          chmod 777 zap-out
          docker run --rm --network host \
            -v "$PWD/zap-out:/zap/wrk:rw" \
            "$ZAP_IMAGE" \
            zap-baseline.py \
              -t "$TARGET/docs" \
              -c rules.tsv \
              -m 1 \
              -I \
              -r zap-report.html \
              -J zap-report.json

      # Deja las alertas en el resumen del run (para la captura del PR y de la presentación).
      - name: Resumen de alertas
        if: always()
        run: |
          {
            echo "## ZAP baseline"
            echo ""
            if [ -f zap-out/zap-report.json ]; then
              echo "| Riesgo | Alerta | Instancias |"
              echo "|---|---|---|"
              jq -r '.site[].alerts[] | "| \(.riskdesc) | \(.name) | \(.instances | length) |"' zap-out/zap-report.json
            else
              echo "No se generó el reporte de ZAP."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Publicar el reporte de ZAP
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zap-report
          path: |
            zap-out/zap-report.html
            zap-out/zap-report.json
          if-no-files-found: warn
          retention-days: 30

      - name: Logs del backend (si falló)
        if: failure()
        run: docker logs backend

  # ---------------------------------------------------------------------------
  # sign-and-attest (tarjeta #14): firma keyless con Cosign + cosign verify
  # ---------------------------------------------------------------------------
  # Corre solo si iac-scan y container-scan pasaron. Sube la imagen a GHCR, la firma
  # con el token OIDC de GitHub (sin llaves guardadas) y verifica la firma en el mismo job.
  # En PRs desde forks se omite: ahí GITHUB_TOKEN no puede escribir paquetes ni pedir OIDC.
  sign-and-attest:
    name: sign-and-attest
    needs: [iac-scan, container-scan]
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write   # subir la imagen a GHCR
      id-token: write   # pedir el token OIDC con el que Cosign firma (keyless)
    env:
      IMAGE: ghcr.io/triageops-ts/meditriage-backend
      COSIGN_VERSION: "v2.5.3"
    steps:
      - name: Descargar el código
        uses: actions/checkout@v4

      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Iniciar sesión en GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Tag distinto al de ci.yml (que usa solo el SHA) para no pisar la imagen que se despliega.
      # Lo que se firma es el digest, no el tag.
      - name: Construir y subir la imagen
        id: build
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: ghcr.io/triageops-ts/meditriage-backend:signed-${{ github.sha }}

      - name: Instalar Cosign
        uses: sigstore/cosign-installer@v3
        with:
          cosign-release: ${{ env.COSIGN_VERSION }}

      # Firma keyless: la identidad del firmante es este workflow, certificada por Fulcio.
      - name: Firmar la imagen (Cosign keyless)
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: cosign sign --yes "${IMAGE}@${DIGEST}"

      # Verifica que la firma es de ESTE workflow y de GitHub Actions. Si no coincide, el job falla.
      - name: Verificar la firma (cosign verify)
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          cosign verify \
            --certificate-identity-regexp "^https://github\.com/${GITHUB_REPOSITORY}/\.github/workflows/supply-chain\.yml@" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
            "${IMAGE}@${DIGEST}" 2>&1 | tee cosign-verify.txt

      # Deja la evidencia en el resumen del run (para la captura del PR y de la presentación).
      - name: Publicar evidencia en el resumen
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          {
            echo "## Firma Cosign verificada"
            echo ""
            echo "Imagen: \`${IMAGE}@${DIGEST}\`"
            echo ""
            echo '```'
            head -n 12 cosign-verify.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # ---------------------------------------------------------------------------
      # TODO #15: Attestation SLSA nivel 2
      # ---------------------------------------------------------------------------
      - name: Generar predicate de provenance
        run: |
          cat <<EOF > provenance.json
          {
            "builder": {
              "id": "https://github.com/actions/runner"
            },
            "buildType": "https://github.com/actions/actions",
            "invocation": {
              "configSource": {
                "uri": "git+https://github.com/${GITHUB_REPOSITORY}.git",
                "digest": {
                  "sha1": "${GITHUB_SHA}"
                },
                "entryPoint": ".github/workflows/supply-chain.yml"
              }
            }
          }
          EOF

      - name: Adjuntar attestation SLSA a la imagen (cosign attest)
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          cosign attest --yes --type slsaprovenance --predicate provenance.json "${IMAGE}@${DIGEST}"

      - name: Verificar attestation (cosign verify-attestation)
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          cosign verify-attestation \
            --type slsaprovenance \
            --certificate-identity-regexp "^https://github\.com/${GITHUB_REPOSITORY}/\.github/workflows/supply-chain\.yml@" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
            "${IMAGE}@${DIGEST}"


      - name: Checkout GitOps Repository
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/checkout@v4
        with:
          repository: triageops-ts/triageops-gitops
          ref: main
          token: ${{ secrets.GITOPS_TOKEN }}
          path: gitops

      - name: Update GitOps with verified image digest
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        working-directory: gitops
        env:
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          python - <<'PY'
          import os
          import re
          from pathlib import Path

          path = Path("overlays/dev/kustomization.yaml")
          content = path.read_text()

          digest = os.environ["IMAGE_DIGEST"]

          if not re.fullmatch(r"sha256:[a-f0-9]{64}", digest):
              raise SystemExit(f"Invalid image digest: {digest}")

          updated, count = re.subn(
              r'(?m)^(\s*digest:\s*).*$',
              lambda m: f'{m.group(1)}{digest}',
              content
          )

          if count != 1:
              raise SystemExit(
                  f"Expected exactly one digest field, found {count}"
              )

          path.write_text(updated)
          PY

      - name: Commit and Push Verified Image Digest
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        working-directory: gitops
        env:
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add overlays/dev/kustomization.yaml

          if git diff --cached --quiet; then
            echo "No GitOps changes to commit."
          else
            git commit -m "chore(dev): deploy verified digest ${IMAGE_DIGEST}"
            git push origin HEAD:main
          fi
