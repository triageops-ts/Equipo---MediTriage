name: Security

# Sin filtros de rutas: los tres checks (sast, sca, secrets) deben aparecer en todos los PRs.
on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

# Los tres jobs no tienen "needs" entre ellos, por lo que corren en paralelo.
jobs:
  # ---------------------------------------------------------------------------
  # Tarjeta 16
  # ---------------------------------------------------------------------------
  sast:
    name: sast
    runs-on: ubuntu-latest
    steps:
      - name: Pendiente (Tarjeta 2)
        run: echo "Aquí va Semgrep con p/owasp-top-ten y las reglas propias de .semgrep/"

  # ---------------------------------------------------------------------------
  # Tarjeta 18
  # ---------------------------------------------------------------------------
  sca:
    name: sca
    runs-on: ubuntu-latest
    steps:
      - name: Pendiente (Tarjeta 4)
        run: echo "Aquí va Trivy filesystem (HIGH/CRITICAL con parche) y la generación del SBOM CycloneDX"


  # Se usa el binario y no gitleaks-action, porque en repos de organización
  # la acción exige una licencia (GITLEAKS_LICENSE).
  
  secrets:
    name: secrets
    runs-on: ubuntu-latest
    env:
      GITLEAKS_VERSION: "8.30.0"
    steps:
      - name: Descargar el código con todo el historial
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Instalar gitleaks
        run: |
          set -euo pipefail
          base="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
          file="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          cd "$RUNNER_TEMP"
          curl -sSfL -O "${base}/${file}"
          curl -sSfL -O "${base}/gitleaks_${GITLEAKS_VERSION}_checksums.txt"
          sha256sum --ignore-missing -c "gitleaks_${GITLEAKS_VERSION}_checksums.txt"
          tar -xzf "${file}" gitleaks
          "$RUNNER_TEMP/gitleaks" version

      - name: Escanear el historial completo (gitleaks)
        run: |
          "$RUNNER_TEMP/gitleaks" git \
            --config "$GITHUB_WORKSPACE/.gitleaks.toml" \
            --log-opts="--all" \
            --redact \
            --verbose \
            .
