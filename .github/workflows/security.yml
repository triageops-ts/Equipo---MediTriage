name: Security

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

# Los tres jobs no tienen "needs" entre ellos, por lo que corren en paralelo.
jobs:
  # ---------------------------------------------------------------------------
  # Tarjeta 16
  # ---------------------------------------------------------------------------
  sast:
    name: sast
    runs-on: ubuntu-latest
    steps:
      - name: Pendiente (Tarjeta 16)
        run: echo "Aquí va Semgrep con p/owasp-top-ten y las reglas propias de .semgrep/"

  # ---------------------------------------------------------------------------
  # Tarjeta 18
  # ---------------------------------------------------------------------------
  sca:
    name: sca
    runs-on: ubuntu-latest
    env:
      # Binario oficial con verificación de checksum; no trivy-action
      # (sus tags fueron comprometidos en marzo de 2026).
      TRIVY_VERSION: "0.76.1"
    steps:
      - name: Descargar el código
        uses: actions/checkout@v4

      - name: Instalar Trivy
        run: |
          set -euo pipefail
          base="https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}"
          file="trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz"
          cd "$RUNNER_TEMP"
          curl -sSfL -O "${base}/${file}"
          curl -sSfL -O "${base}/trivy_${TRIVY_VERSION}_checksums.txt"
          sha256sum --ignore-missing -c "trivy_${TRIVY_VERSION}_checksums.txt"
          tar -xzf "${file}" trivy
          "$RUNNER_TEMP/trivy" --version

      # Falla solo si hay vulnerabilidades HIGH/CRITICAL con parche disponible.
      - name: Escanear dependencias (Trivy filesystem)
        run: |
          "$RUNNER_TEMP/trivy" fs \
            --scanners vuln \
            --severity HIGH,CRITICAL \
            --ignore-unfixed \
            --exit-code 1 \
            --format table \
            .

      # Genera el inventario de dependencias (SBOM) en formato CycloneDX.
      # Corre aunque el escaneo anterior falle, para que el SBOM exista siempre.
      - name: Generar SBOM (CycloneDX)
        if: ${{ !cancelled() }}
        run: |
          "$RUNNER_TEMP/trivy" fs \
            --format cyclonedx \
            --output sbom.json \
            .

      # Publica el SBOM como artefacto del run (se descarga desde la pestaña Summary).
      - name: Publicar SBOM como artefacto
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: sbom.json
          if-no-files-found: error
          retention-days: 30


  # Se usa el binario y no gitleaks-action, porque en repos de organización
  # la acción exige una licencia (GITLEAKS_LICENSE).
  
  secrets:
    name: secrets
    runs-on: ubuntu-latest
    env:
      GITLEAKS_VERSION: "8.30.0"
    steps:
      - name: Descargar el código con todo el historial
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Instalar gitleaks
        run: |
          set -euo pipefail
          base="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
          file="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          cd "$RUNNER_TEMP"
          curl -sSfL -O "${base}/${file}"
          curl -sSfL -O "${base}/gitleaks_${GITLEAKS_VERSION}_checksums.txt"
          sha256sum --ignore-missing -c "gitleaks_${GITLEAKS_VERSION}_checksums.txt"
          tar -xzf "${file}" gitleaks
          "$RUNNER_TEMP/gitleaks" version

      - name: Escanear el historial completo (gitleaks)
        run: |
          "$RUNNER_TEMP/gitleaks" git \
            --config "$GITHUB_WORKSPACE/.gitleaks.toml" \
            --log-opts="--all" \
            --redact \
            --verbose \
            .
